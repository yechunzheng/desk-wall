<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #121a2b;
    --panel2: #182236;
    --border: #243147;
    --text: #e8eef8;
    --muted: #8b9bb4;
    --accent: #5b9cff;
    --yellow: #e6b84a;
    --red: #e85d5d;
    --green: #3ecf8e;
    --row-overdue: rgba(232, 93, 93, 0.22);
    --row-due: rgba(230, 184, 74, 0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  /* 设计画布固定 1920×1080；小屏由 JS fit() 整体缩放 */
  #stage {
    width: 1920px; height: 1080px;
    position: absolute; left: 0; top: 0;
    transform-origin: top left;
    display: grid;
    grid-template-rows: 64px 1fr 40px;
    padding: 12px 20px 10px;
    gap: 10px;
  }
  /* 顶栏 */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 0 28px; gap: 16px;
  }
  .top .brand { font-size: 26px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
  .top .brand span { color: var(--accent); font-weight: 500; margin-left: 12px; font-size: 20px; }
  .top .tabs {
    display: flex; gap: 8px; align-items: center; flex: 1; justify-content: center;
  }
  .tab-btn {
    font-size: 18px; font-weight: 700; padding: 8px 22px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    cursor: pointer; letter-spacing: 1px;
  }
  .tab-btn.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .top .clock { font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
  .top .meta { text-align: right; color: var(--muted); font-size: 18px; line-height: 1.45; white-space: nowrap; }
  .top .meta b { color: var(--text); font-weight: 600; }

  .view { min-height: 0; overflow: hidden; }
  .view.hidden { display: none !important; }
  #view-global {
    display: grid;
    grid-template-rows: 300px 168px 1fr;
    gap: 10px; min-height: 0;
  }
  #view-yiyao {
    display: grid;
    grid-template-rows: 52px 96px 1fr 168px;
    gap: 8px; min-height: 0;
  }

  /* 上半三栏 */
  .upper {
    display: grid; grid-template-columns: 1.35fr 0.95fr 1.1fr; gap: 12px; min-height: 0;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .card h2 {
    font-size: 18px; font-weight: 700; color: var(--muted);
    letter-spacing: 1px; margin-bottom: 8px; flex-shrink: 0;
  }
  .card h2 em { font-style: normal; color: var(--accent); margin-left: 8px; font-weight: 600; }

  #decisions {
    display: flex; flex-direction: column; gap: 6px;
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding-right: 4px; scrollbar-gutter: stable;
  }
  #decisions::-webkit-scrollbar { width: 8px; }
  #decisions::-webkit-scrollbar-thumb {
    background: rgba(100,140,200,0.45); border-radius: 4px;
  }
  .dec-item {
    background: var(--panel2); border-radius: 8px; padding: 8px 12px;
    border-left: 4px solid var(--accent); flex-shrink: 0;
  }
  .dec-item .t { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .dec-item .s { font-size: 15px; color: var(--yellow); margin-top: 3px; line-height: 1.3; }
  .dec-item .s::before { content: "建议："; color: var(--muted); }

  #blockers {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding-right: 4px; scrollbar-gutter: stable;
  }
  #blockers::-webkit-scrollbar { width: 8px; }
  #blockers::-webkit-scrollbar-thumb {
    background: rgba(100,140,200,0.45); border-radius: 4px;
  }
  .blk {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0; border-bottom: 1px solid var(--border);
    font-size: 15px; line-height: 1.3; min-width: 0;
  }
  .blk > div { min-width: 0; flex: 1; overflow: hidden; }
  .blk:last-child { border-bottom: none; }
  .badge {
    flex-shrink: 0; font-size: 12px; font-weight: 700; padding: 1px 6px;
    border-radius: 4px; margin-top: 1px;
  }
  .badge.overdue { background: var(--red); color: #fff; }
  .badge.due_soon { background: var(--yellow); color: #1a1200; }
  .blk .tt {
    font-weight: 600; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 100%;
  }
  .blk .why { display: none; }

  .lanes {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px;
    flex: 1; min-height: 0;
  }
  .lane {
    background: var(--panel2); border-radius: 8px; padding: 10px 12px;
    display: flex; flex-direction: column; justify-content: space-between;
    min-height: 0; overflow: hidden;
  }
  .lane .name { font-size: 18px; font-weight: 700; flex-shrink: 0; }
  .lane .nums { display: flex; gap: 12px; margin-top: 4px; flex-shrink: 0; }
  .lane .num { text-align: center; }
  .lane .num b { display: block; font-size: 28px; font-weight: 800; line-height: 1.05; }
  .lane .num span { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .lane .num.w b { color: var(--yellow); }
  .lane .num.c b { color: var(--green); }

  .week {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 16px 10px; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .week .week-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 6px; flex-shrink: 0;
  }
  .week .week-head h2 { font-size: 18px; color: var(--muted); letter-spacing: 1px; }
  .week .week-head h2 em { font-style: normal; color: var(--accent); margin-left: 10px; font-weight: 600; font-size: 17px; }
  .week .week-head .upd { font-size: 14px; color: var(--muted); }
  .week-body {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: 1.4fr 0.55fr 1.2fr; gap: 12px;
  }
  .week-col {
    background: var(--panel2); border-radius: 8px; padding: 8px 12px;
    min-height: 0; overflow: hidden; display: flex; flex-direction: column;
  }
  .week-col.scrollable {
    overflow-y: auto; overflow-x: hidden;
    scrollbar-gutter: stable;
  }
  .week-col.scrollable::-webkit-scrollbar { width: 8px; }
  .week-col.scrollable::-webkit-scrollbar-thumb {
    background: rgba(100,140,200,0.45); border-radius: 4px;
  }
  .week-col .lab {
    font-size: 13px; font-weight: 700; color: var(--muted);
    letter-spacing: 1px; margin-bottom: 4px; flex-shrink: 0;
  }
  .week-col .lab b { color: var(--green); font-size: 22px; margin-left: 6px; }
  .week-col ol {
    list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 6px;
    overflow: visible; counter-reset: witem;
  }
  .week-col li {
    font-size: 17px; font-weight: 650; line-height: 1.35;
    padding: 2px 0; overflow: visible;
    white-space: normal; word-break: break-word;
  }
  .week-col li::before {
    content: counter(witem) ". "; counter-increment: witem;
    color: var(--accent); font-weight: 800;
  }
  .week-closed {
    align-items: center; justify-content: center; text-align: center;
  }
  .week-closed .big {
    font-size: 56px; font-weight: 800; color: var(--green); line-height: 1;
  }
  .week-closed .sub { font-size: 15px; color: var(--muted); margin-top: 4px; }
  .week-placeholder {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 600; color: var(--muted); letter-spacing: 1px;
  }

  .lower {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px 8px; display: flex; flex-direction: column; min-height: 0;
  }
  .lower .head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 8px; flex-shrink: 0;
  }
  .lower .head h2 { font-size: 20px; color: var(--muted); }
  .lower .head .page {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 16px; color: var(--muted); justify-content: flex-end;
  }
  .page-status {
    font-size: 16px; color: var(--muted);
    display: inline-block; text-align: right;
  }
  .section-label {
    font-size: 16px; font-weight: 700; color: var(--accent);
    padding: 6px 0 4px; letter-spacing: 1px;
  }
  table {
    width: 100%; border-collapse: collapse; table-layout: fixed;
    font-size: 17px;
  }
  th {
    text-align: left; color: var(--muted); font-weight: 600; font-size: 15px;
    padding: 4px 8px 8px; border-bottom: 1px solid var(--border);
  }
  td {
    padding: 7px 8px; border-bottom: 1px solid rgba(36,49,71,0.7);
    vertical-align: top; line-height: 1.35;
  }
  col.c1 { width: 28%; }
  col.c2 { width: 16%; }
  col.c3 { width: 28%; }
  col.c4 { width: 18%; }
  col.c5 { width: 10%; }
  tr.overdue td { background: var(--row-overdue); }
  tr.due_soon td { background: var(--row-due); }
  .id { color: var(--accent); font-weight: 700; margin-right: 4px; }
  .list-scroll {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding-right: 4px; scrollbar-gutter: stable;
  }
  .list-scroll::-webkit-scrollbar { width: 8px; }
  .list-scroll::-webkit-scrollbar-thumb {
    background: rgba(100,140,200,0.45); border-radius: 4px;
  }
  .know-block { margin-top: 14px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .know-block .section-label { color: var(--yellow); }

  /* —— 医药周跟进 Tab —— */
  .yy-head {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 20px; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; min-height: 0;
  }
  .yy-head .ttl { font-size: 22px; font-weight: 800; }
  .yy-head .ttl em { font-style: normal; color: var(--accent); margin-left: 10px; font-size: 18px; font-weight: 600; }
  .yy-head .contacts { display: flex; gap: 10px; flex-wrap: wrap; }
  .yy-chip {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; font-size: 16px; font-weight: 700;
  }
  .yy-chip b { color: var(--accent); margin-right: 6px; font-weight: 700; }
  .yy-head .upd { font-size: 15px; color: var(--muted); white-space: nowrap; }

  .yy-main {
    display: grid; grid-template-columns: 1.55fr 1fr; gap: 10px; min-height: 0;
  }
  .yy-blocks {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; min-height: 0;
  }
  .yy-block {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .yy-block h3 {
    font-size: 17px; font-weight: 800; color: var(--accent); margin-bottom: 8px; flex-shrink: 0;
  }
  .yy-block ul {
    list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0;
    overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
  }
  .yy-block li {
    font-size: 16px; font-weight: 650; line-height: 1.35; color: var(--text);
    background: var(--panel2); border-radius: 8px; padding: 8px 10px;
  }
  .yy-right {
    display: grid; grid-template-rows: 1fr 1fr; gap: 10px; min-height: 0;
  }
  .yy-highlights, .yy-metrics {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .yy-highlights h3, .yy-metrics h3, .yy-owners h3, .yy-need h3 {
    font-size: 17px; font-weight: 800; color: var(--muted); margin-bottom: 8px; flex-shrink: 0;
  }
  .yy-highlights ol {
    list-style: none; margin: 0; padding: 0; counter-reset: hi; flex: 1; min-height: 0;
    overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
  }
  .yy-highlights li {
    font-size: 17px; font-weight: 650; line-height: 1.35;
  }
  .yy-highlights li::before {
    content: counter(hi) ". "; counter-increment: hi;
    color: var(--accent); font-weight: 800;
  }
  .yy-metrics table { font-size: 16px; }
  .yy-metrics th { font-size: 14px; }
  .yy-metrics td { padding: 6px 6px; }

  .yy-bottom {
    display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px; min-height: 0;
  }
  .yy-owners, .yy-need {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .yy-owners { overflow-y: auto; }
  .yy-owners table { width: 100%; table-layout: fixed; }
  .yy-owners td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .yy-owners table { font-size: 17px; }
  .yy-owners th { font-size: 14px; }
  .yy-need ul {
    list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0;
    overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
  }
  .yy-need li {
    font-size: 17px; font-weight: 700; line-height: 1.35;
    background: var(--panel2); border-left: 4px solid var(--yellow);
    border-radius: 8px; padding: 8px 12px;
  }
  .yy-placeholder {
    grid-column: 1 / -1; grid-row: 1 / -1;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: var(--muted); letter-spacing: 1px;
  }
  .st-wait { color: var(--yellow); font-weight: 800; }
  .st-ok { color: var(--green); font-weight: 800; }
  .st-miss { color: var(--red); font-weight: 800; }

  /* —— 总揽三大% + 漏斗合计 —— */
  .yy-overview {
    display: grid; grid-template-columns: 1.15fr 1fr; gap: 8px; min-height: 0;
  }
  .yy-big3 {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; min-height: 0;
  }
  .yy-big {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px 12px; display: flex; flex-direction: column; justify-content: center;
    min-height: 0;
  }
  .yy-big .lab { font-size: 14px; color: var(--muted); font-weight: 700; letter-spacing: 1px; }
  .yy-big .num {
    font-size: 42px; font-weight: 900; font-variant-numeric: tabular-nums;
    line-height: 1.05; margin-top: 2px;
  }
  .yy-big .num.na { font-size: 36px; color: var(--muted); font-weight: 700; }
  .yy-big .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .yy-funnel-sum {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px 12px; display: flex; flex-direction: column; min-height: 0; justify-content: center;
  }
  .yy-funnel-sum h3 {
    font-size: 14px; font-weight: 800; color: var(--muted); margin-bottom: 6px; flex-shrink: 0;
  }
  .yy-funnel-bar {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  .yy-fcell {
    background: var(--panel2); border-radius: 8px; padding: 6px 8px; text-align: center;
  }
  .yy-fcell .fl { font-size: 12px; color: var(--muted); font-weight: 700; }
  .yy-fcell .fv {
    font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 2px;
  }
  .yy-fcell .fv.na { color: var(--muted); font-size: 20px; font-weight: 700; }

  /* —— 分品可滚动表（指标+漏斗同行） —— */
  .yy-prodwrap {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px 10px 6px; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .yy-prodwrap h3 {
    font-size: 15px; font-weight: 800; color: var(--muted); margin-bottom: 6px; flex-shrink: 0;
  }
  .yy-prodwrap h3 em { font-style: normal; color: var(--accent); margin-left: 8px; font-weight: 600; font-size: 13px; }
  .yy-prodscroll {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: auto; scrollbar-gutter: stable;
  }
  .yy-prodscroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .yy-prodscroll::-webkit-scrollbar-thumb {
    background: rgba(100,140,200,0.45); border-radius: 4px;
  }
  table.yy-prod {
    width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px;
  }
  table.yy-prod th {
    position: sticky; top: 0; background: var(--panel2); z-index: 1;
    font-size: 11px; color: var(--muted); font-weight: 800; padding: 5px 4px;
    border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap;
  }
  table.yy-prod td {
    padding: 4px 4px; border-bottom: 1px solid rgba(36,49,71,0.65);
    vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  table.yy-prod .spec {
    display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 1px;
  }
  table.yy-prod tr:hover td { background: rgba(91,156,255,0.06); }
  table.yy-prod .nm { font-weight: 800; white-space: normal; line-height: 1.25; }
  table.yy-prod .muted { color: var(--muted); }
  table.yy-prod .tag {
    display: inline-block; font-size: 11px; font-weight: 700; color: var(--yellow);
    border: 1px solid rgba(230,184,74,0.35); border-radius: 4px; padding: 0 5px; margin-left: 4px;
  }
  table.yy-prod .tag.new {
    color: #5b9cff; border-color: rgba(91,156,255,0.45);
  }
  .pct-cell { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .pct-bar {
    flex: 1; height: 8px; background: rgba(36,49,71,0.9); border-radius: 4px; overflow: hidden; min-width: 36px;
  }
  .pct-bar > i {
    display: block; height: 100%; background: linear-gradient(90deg, #3d7aef, #5b9cff); border-radius: 4px;
  }
  .pct-bar > i.warn { background: linear-gradient(90deg, #b8860b, #e6b84a); }
  .pct-bar > i.bad { background: linear-gradient(90deg, #a83a3a, #e85d5d); }
  .pct-bar > i.good { background: linear-gradient(90deg, #1f8a5b, #3ecf8e); }
  .pct-txt {
    font-variant-numeric: tabular-nums; font-weight: 800; font-size: 13px; min-width: 42px; text-align: right;
  }

  /* 压缩原周跟进底栏 */
  .yy-head { padding: 6px 16px; }
  .yy-head .ttl { font-size: 18px; }
  .yy-head .ttl em { font-size: 15px; }
  .yy-chip { padding: 4px 10px; font-size: 14px; }
  .yy-compact {
    display: grid; grid-template-columns: 1.4fr 0.9fr 0.85fr; gap: 8px; min-height: 0;
  }
  .yy-compact .yy-blocks {
    grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  .yy-compact .yy-block { padding: 6px 8px; }
  .yy-compact .yy-block h3 { font-size: 13px; margin-bottom: 4px; }
  .yy-compact .yy-block li { font-size: 12px; padding: 4px 6px; font-weight: 600; }
  .yy-compact .yy-owners, .yy-compact .yy-need {
    padding: 6px 10px;
  }
  .yy-compact .yy-owners h3, .yy-compact .yy-need h3 { font-size: 13px; margin-bottom: 4px; }
  .yy-compact .yy-owners table { font-size: 13px; }
  .yy-compact .yy-owners th { font-size: 11px; }
  .yy-compact .yy-owners td { padding: 3px 4px; }
  .yy-compact .yy-need li { font-size: 13px; padding: 5px 8px; font-weight: 650; }

  .foot {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 0 24px; font-size: 17px;
  }
  .foot .closed b { color: var(--green); }
  .foot .note { color: var(--muted); }
</style>
</head>
<body>

<style id="gate-css">
  #gate {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    background: #0b1220; color: #e8eef8;
    font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  #gate .box {
    width: 420px; max-width: 92vw;
    background: #121a2b; border: 1px solid #243147; border-radius: 14px;
    padding: 28px 28px 22px; box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  #gate h1 { font-size: 22px; margin: 0 0 8px; }
  #gate p { color: #8b9bb4; font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
  #gate input {
    width: 100%; box-sizing: border-box;
    background: #182236; border: 1px solid #243147; border-radius: 8px;
    color: #e8eef8; font-size: 16px; padding: 12px 14px; outline: none;
  }
  #gate input:focus { border-color: #5b9cff; }
  #gate button {
    margin-top: 14px; width: 100%;
    background: #5b9cff; color: #0b1220; border: none; border-radius: 8px;
    font-size: 16px; font-weight: 700; padding: 12px; cursor: pointer;
  }
  #gate button:hover { filter: brightness(1.08); }
  #gate .err { color: #e85d5d; font-size: 13px; margin-top: 10px; min-height: 1.2em; }
  #boardRoot { position: fixed; inset: 0; overflow: hidden; }
  #boardRoot.locked { visibility: hidden; }
</style>

<div id="gate">
  <div class="box">
    <h1>公司执行看板</h1>
    <p>内部页面，请输入访问密码后查看。国内访问海外站可能较慢。</p>
    <form id="gateForm" autocomplete="off">
      <input id="gatePwd" type="password" placeholder="访问密码" autofocus />
      <button type="submit">解锁</button>
      <div class="err" id="gateErr"></div>
    </form>
  </div>
</div>

<div id="boardRoot" class="locked">

<div id="stage">
  <header class="top">
    <div class="brand">公司执行看板 <span id="dateLine"></span></div>
    <div class="tabs" role="tablist">
      <button type="button" class="tab-btn active" data-view="global" id="tabGlobal">全局执行</button>
      <button type="button" class="tab-btn" data-view="yiyao" id="tabYiyao">医药周跟进</button>
    </div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="meta">
      <div><b>杭州</b></div>
      <div>数据截至 <b id="asOf"></b></div>
    </div>
  </header>

  <section class="view" id="view-global">
    <section class="upper">
      <div class="card decisions" id="decisionsCard">
        <h2>今日拍板 <em id="decCount"></em></h2>
        <div id="decisions"></div>
      </div>
      <div class="card blockers">
        <h2>阻塞 / 明天到期</h2>
        <div id="blockers"></div>
      </div>
      <div class="card">
        <h2>四泳道进度</h2>
        <div class="lanes" id="lanes"></div>
      </div>
    </section>

    <section class="week" id="weekCard">
      <div class="week-head">
        <h2>本周工作汇总 <em id="weekLabel"></em></h2>
        <div class="upd" id="weekUpdated"></div>
      </div>
      <div class="week-body" id="weekBody"></div>
    </section>

    <section class="lower">
      <div class="head">
        <h2>对接清单</h2>
        <div class="page" id="pageInfo">
          <span class="page-status" id="pageStatus"></span>
        </div>
      </div>
      <div class="list-scroll" id="listScroll"></div>
    </section>
  </section>

  <section class="view hidden" id="view-yiyao"></section>

  <footer class="foot">
    <div class="closed">今日已关：<b id="closedList"></b></div>
    <div class="note" id="footNote"></div>
  </footer>
</div><!--stage-->

<script>
/* BOARD injected after unlock */
var BOARD = null;

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function tick() {
  const d = new Date();
  document.getElementById("clock").textContent =
    pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
setInterval(tick, 1000); tick();

function fit() {
  const stage = document.getElementById("stage");
  if (!stage) return;
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = "scale(" + s + ")";
  stage.style.left = ((window.innerWidth - 1920 * s) / 2) + "px";
  stage.style.top = ((window.innerHeight - 1080 * s) / 2) + "px";
}
window.addEventListener("resize", fit);
fit();

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function switchView(name) {
  const g = document.getElementById("view-global");
  const y = document.getElementById("view-yiyao");
  const tg = document.getElementById("tabGlobal");
  const ty = document.getElementById("tabYiyao");
  const isY = name === "yiyao";
  g.classList.toggle("hidden", isY);
  y.classList.toggle("hidden", !isY);
  tg.classList.toggle("active", !isY);
  ty.classList.toggle("active", isY);
  try { localStorage.setItem("desk_wall_view", name); } catch (e) {}
}
document.getElementById("tabGlobal").addEventListener("click", () => switchView("global"));
document.getElementById("tabYiyao").addEventListener("click", () => switchView("yiyao"));

window.__boardInit = function() {
  if (!BOARD) return;
  const m = BOARD.meta;
  document.getElementById("dateLine").textContent =
    m.date.slice(5).replace("-", "月") + "日 · " + m.weekday;
  document.getElementById("asOf").textContent = m.data_as_of + "（台账）";
  document.getElementById("footNote").textContent = m.note;
  document.getElementById("decCount").textContent = BOARD.decisions.length + " 条";

  // 拍板
  const decEl = document.getElementById("decisions");
  BOARD.decisions.forEach(d => {
    const div = document.createElement("div");
    div.className = "dec-item";
    div.innerHTML = '<div class="t"></div>' + (d.suggest ? '<div class="s"></div>' : "");
    div.querySelector(".t").textContent = d.title;
    if (d.suggest) div.querySelector(".s").textContent = d.suggest;
    decEl.appendChild(div);
  });

  // 阻塞
  const blkEl = document.getElementById("blockers");
  if (!BOARD.blockers.length) {
    blkEl.innerHTML = '<div class="blk"><div><div class="tt">暂无红色阻塞</div></div></div>';
  } else {
    BOARD.blockers.forEach(b => {
      const div = document.createElement("div");
      div.className = "blk";
      const label = b.urgency === "overdue" ? "逾期" : "临期";
      const cls = b.urgency === "overdue" ? "overdue" : "due_soon";
      div.innerHTML = '<span class="badge ' + cls + '">' + label + '</span><div><div class="tt"></div><div class="why"></div></div>';
      div.querySelector(".tt").textContent = b.title;
      div.querySelector(".why").textContent = b.why || "";
      blkEl.appendChild(div);
    });
  }

  // 泳道
  const lanesEl = document.getElementById("lanes");
  BOARD.lanes.forEach(l => {
    const div = document.createElement("div");
    div.className = "lane";
    div.innerHTML =
      '<div class="name"></div><div class="nums">' +
      '<div class="num"><b></b><span>进行中</span></div>' +
      '<div class="num w"><b></b><span>等董事长</span></div>' +
      '<div class="num c"><b></b><span>今日已关</span></div></div>';
    div.querySelector(".name").textContent = l.name;
    const bs = div.querySelectorAll(".num b");
    bs[0].textContent = l.in_progress;
    bs[1].textContent = l.waiting_chairman;
    bs[2].textContent = l.closed_today;
    lanesEl.appendChild(div);
  });

  // 本周工作汇总
  const ws = BOARD.week_summary || {};
  const weekBody = document.getElementById("weekBody");
  const weekLabel = document.getElementById("weekLabel");
  const weekUpdated = document.getElementById("weekUpdated");
  if (ws.available) {
    weekLabel.textContent = ws.week_label ? ("· " + ws.week_label) : "";
    weekUpdated.textContent = ws.updated_at ? ("更新 " + ws.updated_at) : "";
    const highs = (ws.highlights || []).slice(0, 3);
    const nexts = (ws.next_week || []).slice(0, 3);
    const closedN = (ws.closed || []).length;
    let wh = '';
    wh += '<div class="week-col scrollable"><div class="lab">三大成果</div><ol id="weekHighs"></ol></div>';
    wh += '<div class="week-col week-closed"><div class="big" id="weekClosedN"></div><div class="sub">本周已关</div></div>';
    wh += '<div class="week-col scrollable"><div class="lab">下周重点</div><ol id="weekNext"></ol></div>';
    weekBody.innerHTML = wh;
    document.getElementById("weekClosedN").textContent = String(closedN);
    const hiEl = document.getElementById("weekHighs");
    (highs.length ? highs : ["（暂无）"]).forEach(t => {
      const li = document.createElement("li");
      li.textContent = t;
      hiEl.appendChild(li);
    });
    const nxEl = document.getElementById("weekNext");
    (nexts.length ? nexts : ["（暂无）"]).forEach(t => {
      const li = document.createElement("li");
      li.textContent = t;
      nxEl.appendChild(li);
    });
  } else {
    weekLabel.textContent = "";
    weekUpdated.textContent = "";
    weekBody.innerHTML = '<div class="week-placeholder">本周汇总尚未生成，周日 13:00 后更新</div>';
  }

  // 对接清单
  const items = BOARD.follow_items || [];
  const knowItems = BOARD.know_only_items || [];
  const listEl = document.getElementById("listScroll");
  const pageStatus = document.getElementById("pageStatus");

  function groupByLane(arr) {
    const groups = [];
    let cur = null;
    arr.forEach(it => {
      if (!cur || cur.lane !== it.lane) {
        cur = { lane: it.lane, rows: [] };
        groups.push(cur);
      }
      cur.rows.push(it);
    });
    return groups;
  }

  function renderTable(groups, emptyText) {
    let html = "";
    groups.forEach(sec => {
      html += '<div class="section-label">' + esc(sec.lane) + '</div>';
      html += '<table><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"></colgroup>';
      html += '<thead><tr><th>事项</th><th>下一步谁做</th><th>下一节点</th><th>状态</th><th>风险</th></tr></thead><tbody>';
      sec.rows.forEach(r => {
        const cls = r.urgency === "overdue" ? "overdue" : (r.urgency === "due_soon" ? "due_soon" : "");
        html += '<tr class="' + cls + '">';
        html += '<td><span class="id">' + esc(r.id) + '</span>' + esc(String(r.title || "").replace(r.id + " ", "")) + '</td>';
        html += '<td>' + esc(r.next_who) + '</td>';
        html += '<td>' + esc(r.next_node) + '</td>';
        html += '<td>' + esc(r.status) + '</td>';
        html += '<td>' + esc(r.risk) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    });
    return html || ('<div style="color:var(--muted);padding:12px 4px">' + emptyText + '</div>');
  }

  let body = renderTable(groupByLane(items), "暂无跟进事项");
  if (knowItems.length) {
    body += '<div class="know-block">';
    body += '<div class="section-label">只需知道（' + knowItems.length + '）</div>';
    body += renderTable(groupByLane(knowItems), "无");
    body += '</div>';
  }
  listEl.innerHTML = body;

  let status = "共 " + items.length + " 条跟进";
  if (knowItems.length) status += " · " + knowItems.length + " 条只需知道";
  pageStatus.textContent = status;

  // 今日已关
  const closed = BOARD.closed_today.map(c => c.id).filter(Boolean);
  document.getElementById("closedList").textContent =
    closed.length ? closed.join(" · ") : "（无）";

  // 医药周跟进 Tab（总揽 + 分品落地）
  renderYiyao(BOARD.yiyao_week || {}, BOARD.yiyao_progress || {});

  // 恢复上次 Tab（默认全局）
  let saved = "global";
  try { saved = localStorage.getItem("desk_wall_view") || "global"; } catch (e) {}
  if (saved === "yiyao") switchView("yiyao");
}; /* __BOARD_INIT_END__ */

function statusClass(st) {
  const s = String(st || "");
  if (/未交|缺口|逾期|缺/.test(s)) return "st-miss";
  if (/完成|已交|齐/.test(s)) return "st-ok";
  return "st-wait";
}

function fmtDash(v) {
  if (v === null || v === undefined || v === "") return "—";
  return String(v);
}
function fmtPct(v) {
  if (v === null || v === undefined || v === "") return "—";
  const n = Number(v);
  if (!isFinite(n)) return "—";
  return (Math.round(n * 10) / 10) + "%";
}
function pctBar(v) {
  if (v === null || v === undefined || v === "") {
    return '<div class="pct-cell"><div class="pct-bar"></div><span class="pct-txt muted">—</span></div>';
  }
  const n = Number(v);
  if (!isFinite(n)) {
    return '<div class="pct-cell"><div class="pct-bar"></div><span class="pct-txt muted">—</span></div>';
  }
  const w = Math.max(0, Math.min(100, n));
  let cls = "";
  if (n >= 100) cls = "good";
  else if (n < 40) cls = "bad";
  else if (n < 70) cls = "warn";
  return '<div class="pct-cell"><div class="pct-bar"><i class="' + cls + '" style="width:' + w + '%"></i></div>' +
    '<span class="pct-txt">' + fmtPct(n) + '</span></div>';
}
function bigPct(label, v, sub) {
  const na = (v === null || v === undefined || v === "");
  return '<div class="yy-big"><div class="lab">' + esc(label) + '</div>' +
    '<div class="num' + (na ? ' na' : '') + '">' + (na ? "—" : fmtPct(v)) + '</div>' +
    '<div class="sub">' + esc(sub || "") + '</div></div>';
}
function fcell(lab, v) {
  const na = (v === null || v === undefined || v === "");
  return '<div class="yy-fcell"><div class="fl">' + esc(lab) + '</div>' +
    '<div class="fv' + (na ? ' na' : '') + '">' + (na ? "—" : fmtDash(v)) + '</div></div>';
}

function renderYiyao(yy, prog) {
  const root = document.getElementById("view-yiyao");
  prog = prog || {};
  const hasWeek = !!(yy && yy.available);
  const hasProg = !!(prog && prog.available);
  if (!hasWeek && !hasProg) {
    root.style.gridTemplateRows = "1fr";
    root.innerHTML = '<div class="yy-placeholder">指标底表待填·联系方式后发</div>';
    return;
  }
  root.style.gridTemplateRows = "52px 96px 1fr 168px";

  const meta = (prog && prog.meta) || {};
  const roll = (prog && prog.rollup) || { pct: {}, hospitals: {} };
  const rp = roll.pct || {};
  const rh = roll.hospitals || {};
  const productsAll = (prog && prog.products) || [];
  const products = productsAll.filter(p => p && p.board_visible !== false);

  // head
  let chips = ((yy && yy.contacts) || []).map(c =>
    '<span class="yy-chip"><b>' + esc(c.region) + '</b>' + esc(c.name) + '</span>'
  ).join("");
  if (!chips) chips = '<span class="yy-chip">对接人待补</span>';
  const upd = (prog && prog.meta && prog.meta.updated_at) || (yy && yy.updated_at) || "";
  const head =
    '<div class="yy-head">' +
      '<div class="ttl">医药 · 销售周跟进<em>' + esc((yy && yy.week_label) || "") + '</em></div>' +
      '<div class="contacts">' + chips + '</div>' +
      '<div class="upd">' + (upd ? ("更新 " + esc(upd)) : "") + '</div>' +
    '</div>';

  // overview: 3 big % + funnel sum
  const yLabel = meta.year ? (meta.year + "年") : "本年";
  const mLabel = meta.month ? (meta.month + "月") : "本月";
  const qLabel = meta.quarter ? ("Q" + meta.quarter) : "本季";
  const overview =
    '<div class="yy-overview">' +
      '<div class="yy-big3">' +
        bigPct("本月进度", rp.month, mLabel + " · 全品汇总") +
        bigPct("本季进度", rp.quarter, qLabel + " · 全品汇总") +
        bigPct("本年进度", rp.year, yLabel + " · 全品汇总") +
      '</div>' +
      '<div class="yy-funnel-sum"><h3>医院开发 · 全品合计（家）</h3><div class="yy-funnel-bar">' +
        fcell("布局总院", rh.layout_total) +
        fcell("意向", rh.intent) +
        fcell("提单", rh.ti_dan) +
        fcell("临采", rh.lin_cai) +
        fcell("过会并采购", rh.guo_hui_procurement) +
      '</div></div>' +
    '</div>';

  // product table: one row = 跟进落地
  let rows = "";
  if (!products.length) {
    rows = '<tr><td colspan="11" class="muted">产品骨架待载入</td></tr>';
  } else {
    products.forEach(p => {
      const sn = (p.status_note || "");
      let tag = "";
      if (sn.indexOf("新品") >= 0) tag = '<span class="tag new">新品</span>';
      else if (p.in_sale === false) tag = '<span class="tag">待进院</span>';
      const t = p.targets || {};
      const pc = p.pct || {};
      const h = p.hospitals || {};
      const label = p.short_name || p.name || "";
      const spec = p.spec || "";
      const tipParts = [p.name || "", spec, p.price_note || "", p.manufacturer || ""].filter(Boolean);
      const tip = tipParts.join(" · ");
      const nmHtml = esc(label) + tag + (spec ? ('<span class="spec">' + esc(spec) + '</span>') : "");
      rows += '<tr>' +
        '<td class="nm" title="' + esc(tip) + '">' + nmHtml + '</td>' +
        '<td class="muted">' + fmtDash(t.year) + '</td>' +
        '<td class="muted">' + fmtDash(t.month) + '</td>' +
        '<td>' + pctBar(pc.year) + '</td>' +
        '<td>' + pctBar(pc.month) + '</td>' +
        '<td>' + pctBar(pc.quarter) + '</td>' +
        '<td>' + fmtDash(h.layout_total) + '</td>' +
        '<td>' + fmtDash(h.intent) + '</td>' +
        '<td>' + fmtDash(h.ti_dan) + '</td>' +
        '<td>' + fmtDash(h.lin_cai) + '</td>' +
        '<td>' + fmtDash(h.guo_hui_procurement) + '</td>' +
      '</tr>';
    });
  }
  const note = (meta.note || "指标底表待填·联系方式后发");
  const prod =
    '<div class="yy-prodwrap"><h3>分品跟进落地<em>' + esc(note) +
    ' · 后续扩区域/对接人/客户维</em></h3>' +
    '<div class="yy-prodscroll"><table class="yy-prod"><colgroup>' +
      '<col style="width:14%"><col style="width:7%"><col style="width:7%">' +
      '<col style="width:11%"><col style="width:10%"><col style="width:10%">' +
      '<col style="width:8%"><col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:8%">' +
    '</colgroup><thead><tr>' +
      '<th>品规</th><th>年目标</th><th>月目标</th><th>年完成比</th><th>月%</th><th>季%</th>' +
      '<th>布局总院</th><th>意向</th><th>提单</th><th>临采</th><th>过会并采购</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';

  // compact week strip
  let blocksHtml = '<div class="yy-blocks">';
  const blocks = ((yy && yy.blocks) || []).slice(0, 5);
  const fallbackNames = ["空白医院开发","存量医院上量","省客户签约","签约后开发","指标"];
  for (let i = 0; i < 5; i++) {
    const b = blocks[i] || { name: fallbackNames[i], points: ["暂无"] };
    blocksHtml += '<div class="yy-block"><h3>' + esc(b.name || fallbackNames[i]) + '</h3><ul>';
    const pts = (b.points && b.points.length) ? b.points : ["暂无"];
    pts.slice(0, 2).forEach(pt => { blocksHtml += '<li>' + esc(pt) + '</li>'; });
    blocksHtml += '</ul></div>';
  }
  blocksHtml += '</div>';

  let owners = '<table><thead><tr><th>对接人</th><th>范围</th><th>本周</th><th>状态</th></tr></thead><tbody>';
  const os = (yy && yy.by_owner) || [];
  if (!os.length) {
    owners += '<tr><td colspan="4" class="muted">指标底表待填·联系方式后发</td></tr>';
  } else {
    os.forEach(o => {
      owners += '<tr><td>' + esc(o.name) + '</td><td>' + esc(o.region) + '</td><td>' +
        esc(o.plan_or_done) + '</td><td class="' + statusClass(o.status) + '">' + esc(o.status) + '</td></tr>';
    });
  }
  owners += '</tbody></table>';

  let need = '<ul>';
  const ns = (yy && yy.need_chairman && yy.need_chairman.length) ? yy.need_chairman : ["（暂无）"];
  ns.slice(0, 3).forEach(t => { need += '<li>' + esc(t) + '</li>'; });
  need += '</ul>';

  const compact =
    '<div class="yy-compact">' +
      blocksHtml +
      '<div class="yy-owners"><h3>三人回执</h3>' + owners + '</div>' +
      '<div class="yy-need"><h3>需拍板</h3>' + need + '</div>' +
    '</div>';

  root.innerHTML = head + overview + prod + compact;
}

</script>

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function deriveKey(password, salt, iterations) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}

async function decryptBoard(password) {
  const salt = b64ToBytes(ENC_PAYLOAD.salt);
  const iv = b64ToBytes(ENC_PAYLOAD.iv);
  const data = b64ToBytes(ENC_PAYLOAD.data);
  const key = await deriveKey(password, salt, ENC_PAYLOAD.iter || 210000);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
  return JSON.parse(new TextDecoder().decode(plain));
}

(function gateBoot() {
  const form = document.getElementById("gateForm");
  const err = document.getElementById("gateErr");
  const pwdEl = document.getElementById("gatePwd");
  const KEY = "desk_wall_ok";

  async function tryUnlock(pwd, remember) {
    err.textContent = "";
    try {
      const board = await decryptBoard(pwd);
      BOARD = board;
      window.BOARD = board;
      document.getElementById("gate").remove();
      document.getElementById("boardRoot").classList.remove("locked");
      if (remember) localStorage.setItem(KEY, pwd);
      if (typeof window.__boardInit === "function") window.__boardInit();
      // soft full refresh every 60s (localStorage keeps unlock across refresh)
      setInterval(() => { location.reload(); }, 60000);
    } catch (e) {
      err.textContent = "密码错误或数据损坏";
      pwdEl.value = "";
      pwdEl.focus();
      throw e;
    }
  }

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    tryUnlock(pwdEl.value, true).catch(() => {});
  });

  const saved = localStorage.getItem(KEY);
  if (saved) {
    tryUnlock(saved, false).catch(() => localStorage.removeItem(KEY));
  }
})();
</script>
